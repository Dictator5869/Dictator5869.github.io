<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Computing for Kids</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-dark: #0d1117;
        }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            border: 2px solid var(--neon-blue);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 0 20px var(--neon-blue);
            max-width: 600px;
        }
        h1 { color: var(--neon-blue); text-transform: uppercase; letter-spacing: 2px; }
        p { line-height: 1.6; color: #c9d1d9; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            border: 2px solid var(--neon-purple);
            color: var(--neon-purple);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background: var(--neon-purple);
            color: white;
            box-shadow: 0 0 15px var(--neon-purple);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Safeguarding the Future</h1>
        <p>Building tools to help the next generation navigate the digital world safely.</p>
        <p>Currently developing WinForms and Python applications designed for early-age digital literacy.</p>
        <a href="https://github.com/ictator5869" class="btn">View My Projects</a>
    </div>
</body>
</html>
